name: Heikin Ashi Signals Bot

on:
  schedule:
    # كل 30 دقيقة داخل نافذة التداول (00:00 - 09:00 UTC)
    - cron: '0 0 * * *'     # 00:00 UTC
    - cron: '30 0 * * *'    # 00:30 UTC
    - cron: '0 1 * * *'     # 01:00 UTC
    - cron: '30 1 * * *'    # 01:30 UTC
    - cron: '0 2 * * *'     # 02:00 UTC
    - cron: '30 2 * * *'    # 02:30 UTC
    - cron: '0 3 * * *'     # 03:00 UTC
    - cron: '30 3 * * *'    # 03:30 UTC
    - cron: '0 4 * * *'     # 04:00 UTC
    - cron: '30 4 * * *'    # 04:30 UTC
    - cron: '0 5 * * *'     # 05:00 UTC
    - cron: '30 5 * * *'    # 05:30 UTC
    - cron: '0 6 * * *'     # 06:00 UTC
    - cron: '30 6 * * *'    # 06:30 UTC
    - cron: '0 7 * * *'     # 07:00 UTC
    - cron: '30 7 * * *'    # 07:30 UTC
    - cron: '0 8 * * *'     # 08:00 UTC
    - cron: '30 8 * * *'    # 08:30 UTC
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Cache cooldown file
        uses: actions/cache@v4
        with:
          path: cooldown.json
          key: ha-cooldown-state-v1
          restore-keys: ha-cooldown-

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python ha_signals_bot.py
